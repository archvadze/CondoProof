# Review only. Install after the application and certificates are ready.
limit_req_zone $binary_remote_addr zone=condoproof_auth:1m rate=10r/m;
limit_req_zone $binary_remote_addr zone=condoproof_api:1m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name condoproof.space www.condoproof.space;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://condoproof.space$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.condoproof.space;

    ssl_certificate /etc/letsencrypt/live/condoproof.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/condoproof.space/privkey.pem;

    return 301 https://condoproof.space$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name condoproof.space;

    ssl_certificate /etc/letsencrypt/live/condoproof.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/condoproof.space/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 512k;
    limit_req_status 429;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    proxy_buffering off;

    location ~ ^/api/backend/auth/wallet/(challenge|verify)$ {
        limit_req zone=condoproof_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:3010;
    }

    location /api/backend/ {
        limit_req zone=condoproof_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:3010;
    }

    location / {
        proxy_pass http://127.0.0.1:3010;
    }
}
